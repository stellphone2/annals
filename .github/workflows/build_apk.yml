name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK with Buildozer
    runs-on: ubuntu-22.04

    steps:
      # 1. Check out your code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python 3.11
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Java 17 — required by sdkmanager 16+ that ships on the runner
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. System libraries needed by python-for-android / Buildozer
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            build-essential ccache

      # 5. Install Buildozer + Cython
      #    Pin Cython < 3.0.0 — Cython 3.x breaks many Kivy C-extensions
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer

      # 6. Use the Android SDK already on the ubuntu-22.04 runner
      #    ($ANDROID_SDK_ROOT is set by the runner, no extra action needed).
      #    Accept all licences and install the exact packages Buildozer needs.
      - name: Accept SDK licences and install packages
        run: |
          # Find sdkmanager wherever cmdline-tools put it
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
                            -name sdkmanager -type f 2>/dev/null | head -1)
          echo "Using sdkmanager at: $SDKMANAGER"

          # Accept every licence non-interactively
          yes | "$SDKMANAGER" --licenses || true

          # Install the packages Buildozer requires
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;34.0.0"

      # 7. Cache the NDK + python-for-android (the slow part on first run)
      - name: Cache Buildozer NDK / p4a
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # 8. Build! Point Buildozer at the runner's pre-installed SDK.
      - name: Build APK
        run: buildozer -v android debug
        env:
          ANDROIDSDK: ${{ env.ANDROID_SDK_ROOT }}

      # 9. Upload the APK so you can download it from the Actions tab
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: annals-debug-apk
          path: bin/*.apk
          retention-days: 30
