name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Also allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK with Buildozer
    runs-on: ubuntu-22.04

    steps:
      # 1. Check out your code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install system dependencies required by Buildozer / Android SDK
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            build-essential ccache

      # 4. Install Buildozer and Cython
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      # 5. Cache the Buildozer global directory (Android SDK/NDK, p4a, etc.)
      #    This can save 10-20 minutes on subsequent runs.
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      # 6. Pre-accept Android SDK licences so sdkmanager never blocks on a prompt
      - name: Accept Android SDK licenses
        run: |
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          # android-sdk-license hashes (covers build-tools, platform-tools, etc.)
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n' \
            > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          # android-sdk-preview-license hash
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' \
            > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          # intel-android-extra-license hash
          printf '\nd975f751698a77b662f1254ddbeed3901e976f5a\n' \
            > $HOME/.buildozer/android/platform/android-sdk/licenses/intel-android-extra-license

      # 7. Build the APK — pipe `yes` as belt-and-suspenders for any remaining prompts
      - name: Build APK
        run: yes | buildozer -v android debug 2>&1 | tee build.log; exit ${PIPESTATUS[1]}
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/.buildozer/android/platform/android-sdk

      # 7. Upload the APK so you can download it from the Actions tab
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: annals-debug-apk
          path: bin/*.apk
          retention-days: 30
