name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK with Buildozer
    runs-on: ubuntu-22.04

    steps:
      # 1. Check out your code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python 3.11
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Java 17 — required by sdkmanager 16+ that ships on the runner
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. System libraries needed by python-for-android / Buildozer
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            build-essential ccache

      # 5. Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython

      # 6. Accept Android SDK licences by writing hash files directly.
      #    This is the most reliable non-interactive method — no prompts involved.
      - name: Accept SDK licences and install packages
        run: |
          SDK_LICENCES="$ANDROID_SDK_ROOT/licenses"
          mkdir -p "$SDK_LICENCES"

          # android-sdk-license  (covers build-tools, platforms, platform-tools)
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' \
            > "$SDK_LICENCES/android-sdk-license"

          # android-sdk-preview-license
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' \
            > "$SDK_LICENCES/android-sdk-preview-license"

          # intel-android-extra-license
          printf '\nd975f751698a77b662f1254ddbeed3901e976f5a\n' \
            > "$SDK_LICENCES/intel-android-extra-license"

          # google-gdk-license
          printf '\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n' \
            > "$SDK_LICENCES/google-gdk-license"

          echo "Licence files written:"
          ls -la "$SDK_LICENCES/"

          # Find sdkmanager (cmdline-tools location varies by runner image version)
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
                            -name sdkmanager -type f 2>/dev/null | head -1)
          echo "Using sdkmanager: $SDKMANAGER"

          # Install the SDK packages Buildozer needs
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;34.0.0"

      # 7. Cache the NDK + python-for-android (the slow part on first run)
      - name: Cache Buildozer NDK / p4a
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # 8. Build Android APK
      - name: Build Android APK
        env:
          ACCEPT_BUILD_TOOLS_CHECKSUMS: "true"
          CI: "true"
          ANDROIDSDK: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          # Pre-accept licenses and run debug build non-interactively
          yes | buildozer -v android debug

      # 9. Upload the APK so you can download it from the Actions tab
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: annals-debug-apk
          path: bin/*.apk
          retention-days: 30
