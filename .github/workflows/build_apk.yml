name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK with Buildozer
    runs-on: ubuntu-22.04

    steps:
      # 1. Check out your code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install system dependencies required by Buildozer / p4a
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            build-essential ccache

      # 4. Install Buildozer and Cython
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      # 5. Ensure Java 17 is the active JDK (sdkmanager 16+ requires JDK 17+)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 6. Set up a MODERN Android SDK (cmdline-tools, not the old deprecated 'tools').
      #    This action installs sdkmanager at the path Buildozer expects and sets
      #    ANDROID_SDK_ROOT / ANDROID_HOME environment variables automatically.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 6. Accept all SDK licenses and install the exact packages we need
      - name: Accept SDK licenses and install packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "cmdline-tools;latest" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # 7. Cache only the NDK + python-for-android (the slow downloads).
      #    The SDK itself is handled by the action above.
      - name: Cache Buildozer NDK and p4a
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # 8. Build the APK — tell Buildozer to reuse the SDK the action installed
      - name: Build APK
        run: buildozer -v android debug
        env:
          ANDROIDSDK: ${{ env.ANDROID_SDK_ROOT }}

      # 9. Upload the APK so you can download it from the Actions tab
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: annals-debug-apk
          path: bin/*.apk
          retention-days: 30
